[project]
name = "Monster-level-prediction-in-TTRPG"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.11.*"

dependencies = [
    "tensorflow==2.15.*",
    "tensorflow-probability==0.23",
    "gpflow==2.10.*",
    "tensorflow-io-gcs-filesystem==0.31.*",
    "orf>=0.2.0",
    "mord>=0.7",
    "condor-pytorch>=1.1.0",
    "strenum>=0.4.15",
    "skorch>=1.3.1",
    "spacecutter>=0.2.1",
    "coral-pytorch>=1.4.0",
    "openpyxl>=3.1.5",
    "scikit-learn==1.3.*",
    "torch==2.3.*",
    "seaborn>=0.13.2",
    "sage-importance>=0.0.6",
    "shap>=0.49.1",
    "networkx>=3.6.1",
    "umap-learn>=0.5.7",
    "lightgbm==3.3.*",
]

[tool.uv.sources]
orf = { url = "https://files.pythonhosted.org/packages/source/o/orf/orf-0.2.0.tar.gz" }

[dependency-groups]
notebooks = [
    "jupyter>=1.1.1",
]

style = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "dataset"
]


